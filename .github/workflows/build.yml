name: Build Module for OnePlus 11R (Android 16) Kernel

on:
  push:
  pull_request:

jobs:
  # 1. Կոդի որակի ստուգում (ձեր օրիգինալ workflow-ից)
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Avoid hardcoded 0x0BDA
        run: |
          # Ստուգել, որ usb_intf.c-ում USB_VENDOR_ID_REALTEK-ի փոխարեն ուղղակի 0x0BDA չի օգտագործվում
          grep -c -i "0x0BDA" os_dep/linux/usb_intf.c | grep -w 1

      - name: Find duplicate USB device entries
        run: |
          # Ստուգել, որ կրկնվող USB_DEVICE մակրոսներ չկան
          grep -i "{USB_DEVICE(" os_dep/linux/usb_intf.c | cut -d ')' -f1 | sort | uniq -cd | wc -c | grep -w 0

  # 2. Մոդուլի կոմպիլյացիա Android միջուկի համար
  build:
    runs-on: ubuntu-22.04
    needs: quality-checks   # ըստ ցանկության, կարելի է հանել, եթե ստուգումը պարտադիր չէ

    steps:
      - name: Checkout module source
        uses: actions/checkout@v4
        with:
          path: module

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo clang lld llvm gcc-aarch64-linux-gnu flex bison libssl-dev bc

      - name: Sync kernel sources (manifest)
        run: |
          mkdir -p kernel
          cd kernel
          # Մանիֆեստը OnePlus-ի պաշտոնական kernel_manifest-ից
          repo init -u -b oneplus/sm8475 https://github.com/OnePlusOSS/kernel_manifest/oneplus_11r_b.xml
          # Ներբեռնել միայն անհրաժեշտ պրոյեկտները
          repo sync -j$(nproc) \
            kernel_platform/common \
            kernel_platform/msm-kernel \
            kernel_platform/prebuilts/kernel-build-tools \
            kernel_platform/prebuilts-master/clang/host/linux-x86

          # Ստեղծել build.config-ի symlink-ները, ինչպես նշված է մանիֆեստում
          cd kernel_platform/common
          ln -sf ../msm-kernel/build.config.msm.waipio build.config.msm.waipio
          ln -sf ../msm-kernel/build.config.msm.waipio.tuivm build.config.msm.waipio.tuivm
          ln -sf ../msm-kernel/build.config.msm.lahaina build.config.msm.lahaina

      - name: Prepare kernel build environment
        run: |
          cd kernel/kernel_platform/common

          # Օգտագործել clang-ը prebuilts-ից (կամ կարելի է համակարգի clang-ը)
          export CLANG_PREBUILT_BIN=$(realpath ../prebuilts-master/clang/host/linux-x86/clang-r416183b/bin)
          export PATH="${CLANG_PREBUILT_BIN}:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Ստեղծել .config (OnePlus 11R-ի համար waipio_defconfig)
          # Եթե Ձեր միջուկը այլ defconfig է պահանջում, փոխեք անունը
          make O=out vendor/gki_defconfig

          # Պատրաստել մոդուլների կոմպիլյացիայի համար (ստեղծում է headers)
          make O=out modules_prepare

      - name: Build the WiFi module
        run: |
          cd $GITHUB_WORKSPACE/module

          export CLANG_PREBUILT_BIN=$(realpath ../kernel/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin)
          export PATH="${CLANG_PREBUILT_BIN}:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Կոմպիլյացիա. KDIR-ը ցույց է տալիս միջուկի out-պանակը
          make -C $GITHUB_WORKSPACE/kernel/kernel_platform/common/out \
               M=$(pwd) \
               modules

      - name: Upload compiled module(s)
        uses: actions/upload-artifact@v4
        with:
          name: wifi-module
          path: module/*.ko
